<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1118">
<title>Quick Dial</title>
<style>
  :root{
    --ink:#0E1118; --raised:#181D29; --line:#252C3B;
    --text:#EAEDF4; --muted:#79839B; --signal:#F0A93B;
    --call:#2E9E63; --end:#C0524B; --off:#4A5266;
    --pad: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .screen{display:none;height:100dvh;flex-direction:column}
  .screen.on{display:flex}

  .top{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
  .brand{flex:1;font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .dot.live{background:var(--call)}
  .linkbtn{font-size:15px;color:var(--signal);padding:8px 2px}

  .readout{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 22px;text-align:center;min-height:0}
  .code{font-size:clamp(52px,18vw,80px);font-weight:300;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;line-height:1;color:var(--signal)}
  .code.empty{color:var(--line)}
  .who{margin-top:16px;font-size:23px;font-weight:500;min-height:1.4em}
  .who.miss{color:var(--muted);font-size:17px;font-weight:400}
  .via{margin-top:4px;font-size:13px;color:var(--muted)}
  .countdown{margin-top:10px;font-size:13px;color:var(--signal);min-height:1.2em}

  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 20px}
  .key{height:62px;border-radius:16px;background:var(--raised);font-size:26px;
    font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
  .key:active{background:#232A3A}
  .key.blank{background:none;pointer-events:none}

  .actions{display:flex;gap:12px;padding:14px 20px calc(18px + var(--pad))}
  .callbtn{flex:1;height:60px;border-radius:18px;background:var(--call);font-size:18px;font-weight:600;
    display:flex;align-items:center;justify-content:center}
  .callbtn[disabled]{background:var(--raised);color:var(--off)}
  .sq{width:60px;height:60px;border-radius:18px;background:var(--raised);font-size:21px;color:var(--muted);
    display:flex;align-items:center;justify-content:center}

  .head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:18px;font-weight:600;flex:1}
  .scroll{flex:1;overflow-y:auto}

  .row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .tag{min-width:46px;height:46px;padding:0 8px;border-radius:12px;background:var(--raised);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--signal);flex:0 0 auto}
  .rowmain{flex:1;min-width:0}
  .rowname{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowsub{font-size:13px;color:var(--muted)}
  .pill{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--line);color:var(--muted);margin-left:6px}
  .del{padding:10px;color:var(--muted);font-size:14px}
  .empty{padding:44px 30px;text-align:center;color:var(--muted)}

  form,.panel{padding:16px 18px calc(18px + var(--pad));border-top:1px solid var(--line);display:grid;gap:11px}
  .panel{border-top:0}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
  input,select{width:100%;height:50px;padding:0 13px;border-radius:12px;background:var(--raised);
    border:1px solid var(--line);color:var(--text);font-size:16px}
  input:focus,select:focus{outline:2px solid var(--signal);outline-offset:-1px}
  .pair{display:grid;grid-template-columns:84px 1fr;gap:10px}
  .segs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .seg{height:48px;border-radius:12px;background:var(--raised);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
  .seg.on{border-color:var(--signal);color:var(--signal)}
  .primary{height:52px;border-radius:14px;background:var(--signal);color:#161207;font-weight:600;font-size:16px}
  .ghost{height:48px;border-radius:14px;background:var(--raised);color:var(--text);font-size:15px}
  .toggle{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
  .toggle input{width:auto;height:auto;transform:scale(1.3);accent-color:var(--signal)}
  .toggle span{flex:1}
  .hint{font-size:13px;color:var(--muted);margin:0}
  .warnline{font-size:13px;color:var(--end);min-height:1.2em}
  .okline{font-size:13px;color:var(--signal);min-height:1.2em}

  .peek{position:relative}
  .peek input{padding-right:56px}
  .eye{position:absolute;right:4px;top:0;height:50px;width:50px;display:flex;
    align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
  .eye.on{color:var(--signal)}

  #call{align-items:center;justify-content:center;text-align:center;padding:30px}
  .peer{font-size:30px;font-weight:500;margin-top:10px}
  .state{margin-top:8px;font-size:15px;color:var(--muted)}
  .callrow{display:flex;gap:16px;margin-top:44px}
  .big{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
  .big.end{background:var(--end)}
  .big.accept{background:var(--call)}
  .big.mute{background:var(--raised)}
  .big.mute.on{background:var(--signal);color:#161207}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--pad));
    background:var(--raised);border:1px solid var(--line);padding:11px 18px;border-radius:12px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<audio id="remoteAudio" autoplay playsinline></audio>

<section id="setup" class="screen">
  <div class="head"><h1 id="setupTitle">Create your account</h1></div>
  <div class="panel">
    <div class="segs">
      <button type="button" class="seg on" id="segNew" onclick="setMode('signup')">New account</button>
      <button type="button" class="seg" id="segOld" onclick="setMode('signin')">Sign in</button>
    </div>
    <p class="hint" id="setupHint">Use your name, a slash, then your number - like gaurav/16. An admin approves new accounts before they work.</p>
    <div>
      <label for="myId">Your ID</label>
      <input id="myId" placeholder="gaurav/16" autocapitalize="none" autocomplete="username">
    </div>
    <div>
      <label for="myPass">Password</label>
      <div class="peek">
        <input id="myPass" type="password" placeholder="At least 6 characters" autocomplete="current-password">
        <button type="button" class="eye" id="eyeBtn" onclick="togglePeek()" aria-label="Show password">&#128065;</button>
      </div>
    </div>
    <div class="warnline" id="authWarn"></div>
    <div class="okline" id="authNote"></div>
    <button class="primary" id="authBtn" onclick="submitAuth()">Create account</button>
  </div>
</section>

<section id="dialer" class="screen">
  <div class="top">
    <div class="dot" id="statusDot"></div>
    <div class="brand" id="brandLine">QUICK DIAL</div>
    <button class="linkbtn" onclick="show('list')">Contacts</button>
  </div>

  <div class="readout">
    <div id="code" class="code empty">&#8212;</div>
    <div id="who" class="who"></div>
    <div id="via" class="via"></div>
    <div id="countdown" class="countdown"></div>
  </div>

  <div class="keys" id="keys"></div>

  <div class="actions">
    <button class="sq" onclick="backspace()" aria-label="Backspace">&#9003;</button>
    <button id="callBtn" class="callbtn" disabled onclick="startCall()">Call</button>
  </div>
</section>

<section id="list" class="screen">
  <div class="head">
    <button class="linkbtn" onclick="show('dialer')">&#8249; Back</button>
    <h1>Contacts</h1>
    <button class="linkbtn" onclick="show('settings')">Settings</button>
  </div>
  <div class="scroll" id="rows"></div>
  <form onsubmit="saveContact(event)">
    <div class="segs">
      <button type="button" class="seg on" id="segPhone" onclick="setKind('phone')">Phone number</button>
      <button type="button" class="seg" id="segApp" onclick="setKind('app')">App ID</button>
    </div>
    <div class="pair">
      <div>
        <label for="fCode">Code</label>
        <input id="fCode" inputmode="numeric" placeholder="1" required>
      </div>
      <div>
        <label for="fName">Name</label>
        <input id="fName" placeholder="Amit" required>
      </div>
    </div>
    <div>
      <label for="fTarget" id="targetLabel">Phone number</label>
      <input id="fTarget" placeholder="+919305578983" required autocapitalize="none" autocomplete="off">
    </div>
    <button class="primary" type="submit">Save contact</button>
  </form>
</section>

<section id="settings" class="screen">
  <div class="head">
    <button class="linkbtn" onclick="show('list')">&#8249; Back</button>
    <h1>Settings</h1>
  </div>
  <label class="toggle">
    <input type="checkbox" id="autoDial">
    <span>Call automatically after a pause</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="knownOnly">
    <span>Only accept calls from my contacts</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="ringOn">
    <span>Ring and vibrate for incoming calls</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="autoAnswer">
    <span>Answer incoming calls automatically</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="keepAwake">
    <span>Keep the screen on while the app is open</span>
  </label>
  <div class="panel">
    <div>
      <label for="delay">Wait before auto-calling</label>
      <select id="delay">
        <option value="2000">2 seconds</option>
        <option value="3000">3 seconds</option>
        <option value="4000">4 seconds</option>
        <option value="5000">5 seconds</option>
        <option value="8000">8 seconds</option>
      </select>
    </div>
    <div>
      <label for="answerDelay">Answer automatically after</label>
      <select id="answerDelay">
        <option value="0">Straight away</option>
        <option value="2000">2 seconds</option>
        <option value="5000">5 seconds</option>
        <option value="10000">10 seconds</option>
      </select>
    </div>
    <button class="ghost" id="notifyBtn" onclick="askNotify()">Turn on call notifications</button>
    <p class="hint">Your ID is <b id="idEcho"></b>. App calls need both people to have this page open.</p>
    <button class="ghost" onclick="exportData()">Export contacts</button>
    <button class="ghost" onclick="signOut()">Sign out</button>
    <button class="ghost" onclick="resetAll()">Clear everything</button>
  </div>
</section>

<section id="call" class="screen">
  <div class="via" id="callDir"></div>
  <div class="peer" id="callPeer"></div>
  <div class="state" id="callState"></div>
  <div class="callrow" id="callControls"></div>
</section>

<div class="toast" id="toast"></div>

<script>
const KEY = 'quickdial.web.v1';
const ID_FORMAT = /^[a-z][a-z.-]{1,19}\/[0-9]{1,10}$/;

let db = { id:'', pass:'', items:[], auto:false, delay:3000, knownOnly:false,
           ring:true, autoAnswer:false, answerDelay:0, keepAwake:true };
let authMode = 'signup';
let code = '';
let idleTimer = null, tick = null;

let ws = null, wsReady = false, reconnectAt = 1000;
let pc = null, localStream = null, peer = null, incoming = null;
let iceQueue = [];
let audioCtx = null, ringTimer = null, answerTimer = null;
let wakeLock = null;

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) db = { ...db, ...JSON.parse(raw) }; }catch(e){}
  if(!Array.isArray(db.items)) db.items = [];
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id === 'list') renderList();
  if(id === 'settings'){
    document.getElementById('autoDial').checked = db.auto;
    document.getElementById('delay').value = String(db.delay);
    document.getElementById('knownOnly').checked = db.knownOnly;
    document.getElementById('ringOn').checked = db.ring;
    document.getElementById('autoAnswer').checked = db.autoAnswer;
    document.getElementById('answerDelay').value = String(db.answerDelay);
    document.getElementById('keepAwake').checked = db.keepAwake;
    document.getElementById('idEcho').textContent = db.id;
    paintNotifyButton();
  }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

function togglePeek(){
  const f = document.getElementById('myPass');
  const b = document.getElementById('eyeBtn');
  const showing = f.type === 'text';
  f.type = showing ? 'password' : 'text';
  b.classList.toggle('on', !showing);
}

function setMode(m){
  authMode = m;
  document.getElementById('segNew').classList.toggle('on', m === 'signup');
  document.getElementById('segOld').classList.toggle('on', m === 'signin');
  document.getElementById('setupTitle').textContent =
    m === 'signup' ? 'Create your account' : 'Sign in';
  document.getElementById('setupHint').textContent = m === 'signup'
    ? 'Use your name, a slash, then your number - like gaurav/16. An admin approves new accounts before they work.'
    : 'Use the ID and password you already registered.';
  document.getElementById('authBtn').textContent =
    m === 'signup' ? 'Create account' : 'Sign in';
  document.getElementById('authWarn').textContent = '';
  document.getElementById('authNote').textContent = '';
}

function submitAuth(){
  const id = document.getElementById('myId').value.trim().toLowerCase();
  const pass = document.getElementById('myPass').value;
  const warn = document.getElementById('authWarn');

  if(!ID_FORMAT.test(id)){
    warn.textContent = 'ID must be name/number, like gaurav/16'; return;
  }
  if(pass.length < 6){
    warn.textContent = 'Password must be at least 6 characters'; return;
  }
  warn.textContent = '';
  document.getElementById('authNote').textContent = '';
  document.getElementById('authBtn').textContent = 'Connecting\u2026';

  db.id = id; db.pass = pass;
  connect();
}

function signOut(){
  db.id = ''; db.pass = ''; persist();
  if(ws){ try{ ws.close(); }catch(e){} }
  location.reload();
}

function resetAuthButton(){
  document.getElementById('authBtn').textContent =
    authMode === 'signup' ? 'Create account' : 'Sign in';
}

function connect(){
  if(!db.id) return;
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host);

  ws.onopen = ()=>{
    reconnectAt = 1000;
    ws.send(JSON.stringify({ type:'register', id: db.id, password: db.pass, mode: authMode }));
  };
  ws.onmessage = (ev)=>{
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    handleSignal(m);
  };
  ws.onclose = ()=>{
    wsReady = false; paintStatus();
    if(!db.id || !db.pass) return;
    setTimeout(connect, reconnectAt);
    reconnectAt = Math.min(reconnectAt * 2, 15000);
  };
  ws.onerror = ()=>{};
}
function signal(obj){
  if(ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}
function paintStatus(){
  document.getElementById('statusDot').classList.toggle('live', wsReady);
  document.getElementById('brandLine').textContent = wsReady ? db.id.toUpperCase() : 'CONNECTING\u2026';
}
function dropSocket(){
  if(ws){ ws.onclose = null; try{ ws.close(); }catch(e){} ws = null; }
}

async function handleSignal(m){
  if(m.type === 'registered'){
    wsReady = true;
    persist();
    paintStatus();
    if(!document.getElementById('dialer').classList.contains('on')){
      show('dialer'); refresh();
    }
    return;
  }
  if(m.type === 'pending'){
    wsReady = false;
    document.getElementById('authWarn').textContent = '';
    document.getElementById('authNote').textContent = m.reason || 'Waiting for admin approval.';
    resetAuthButton();
    db.pass = ''; db.id = '';
    dropSocket();
    show('setup');
    return;
  }
  if(m.type === 'authfail'){
    wsReady = false;
    document.getElementById('authWarn').textContent = m.reason || 'Could not sign in';
    document.getElementById('authNote').textContent = '';
    resetAuthButton();
    db.pass = '';
    dropSocket();
    show('setup');
    return;
  }
  if(m.type === 'replaced'){ toast('Signed out - your account changed or opened elsewhere'); return; }
  if(m.type === 'unreachable'){ endCall('They are not online'); return; }

  if(m.type === 'offer'){
    if(pc){ signal({ type:'busy', to:m.from }); return; }
    if(db.knownOnly && !knownCaller(m.from)){
      signal({ type:'reject', to:m.from });
      toast('Blocked a call from ' + m.from);
      return;
    }
    incoming = m;
    peer = m.from;
    const label = nameFor(m.from);
    showCallScreen('Incoming call', label, 'ringing');
    startRing();
    notifyIncoming(label);
    if(db.autoAnswer){
      answerTimer = setTimeout(()=>{ if(incoming) acceptCall(); }, db.answerDelay);
    }
    return;
  }
  if(m.type === 'answer' && pc){
    await pc.setRemoteDescription(m.answer);
    flushIce();
    document.getElementById('callState').textContent = 'Connected';
    return;
  }
  if(m.type === 'ice'){
    if(pc && pc.remoteDescription) await pc.addIceCandidate(m.candidate).catch(()=>{});
    else iceQueue.push(m.candidate);
    return;
  }
  if(m.type === 'busy'){ endCall('They are on another call'); return; }
  if(m.type === 'reject'){ endCall('Call declined'); return; }
  if(m.type === 'hangup'){ endCall('Call ended'); return; }
}
async function flushIce(){
  while(iceQueue.length){ await pc.addIceCandidate(iceQueue.shift()).catch(()=>{}); }
}

/* -------------------------------------------------------------- screen on */
// Screen Wake Lock keeps the display awake while the page is in front. The
// lock is dropped by the browser whenever the page is hidden, so it has to be
// taken again on every return to the foreground.
async function requestWakeLock(){
  if(!db.keepAwake) return;
  if(!('wakeLock' in navigator)) return;
  if(document.hidden) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch(e){
    // Denied on low battery or unsupported - not worth interrupting the user.
  }
}

async function releaseWakeLock(){
  try{ if(wakeLock) await wakeLock.release(); }catch(e){}
  wakeLock = null;
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(db.keepAwake && !wakeLock) requestWakeLock();
});

/* ---------------------------------------------------------------- ringing */
// Browsers block audio until the page has been touched, so the context is
// created on the first interaction and reused after that.
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);

function ringOnce(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [0, 0.55].forEach(off=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, t0 + off);
    osc.frequency.setValueAtTime(620, t0 + off + 0.18);
    gain.gain.setValueAtTime(0.0001, t0 + off);
    gain.gain.exponentialRampToValueAtTime(0.35, t0 + off + 0.03);
    gain.gain.setValueAtTime(0.35, t0 + off + 0.34);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.42);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + off);
    osc.stop(t0 + off + 0.45);
  });
}

function testRing(){ ringOnce(); if(navigator.vibrate) navigator.vibrate(200); }

function startRing(){
  if(!db.ring) return;
  unlockAudio();
  const beat = ()=>{
    ringOnce();
    if(navigator.vibrate) navigator.vibrate([450, 200, 450]);
  };
  beat();
  ringTimer = setInterval(beat, 2600);
}

function stopRing(){
  if(ringTimer){ clearInterval(ringTimer); ringTimer = null; }
  if(navigator.vibrate) navigator.vibrate(0);
}

function askNotify(){
  if(!('Notification' in window)){ toast('This browser has no notifications'); return; }
  Notification.requestPermission().then(()=>{ paintNotifyButton(); });
}

function paintNotifyButton(){
  const b = document.getElementById('notifyBtn');
  if(!b) return;
  if(!('Notification' in window)){ b.textContent = 'Notifications not supported'; b.disabled = true; return; }
  if(Notification.permission === 'granted') b.textContent = 'Call notifications are on';
  else if(Notification.permission === 'denied') b.textContent = 'Notifications blocked in browser settings';
  else b.textContent = 'Turn on call notifications';
}

function notifyIncoming(who){
  try{
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    if(!document.hidden) return;
    const n = new Notification('Quick Dial', { body: who + ' is calling', tag: 'qd-call' });
    n.onclick = ()=>{ window.focus(); n.close(); };
  }catch(e){}
}

/* ------------------------------------------------------------------ calls */
function knownCaller(id){
  return db.items.some(i=>i.kind === 'app' && i.target.toLowerCase() === String(id).toLowerCase());
}
function nameFor(id){
  const hit = db.items.find(i=>i.kind === 'app' && i.target.toLowerCase() === String(id).toLowerCase());
  return hit ? hit.name : id;
}

async function makePeer(){
  pc = new RTCPeerConnection({
    iceServers:[
      { urls:'stun:stun.l.google.com:19302' },
      { urls:'stun:stun1.l.google.com:19302' }
    ]
  });
  pc.onicecandidate = (e)=>{
    if(e.candidate) signal({ type:'ice', to:peer, candidate:e.candidate });
  };
  pc.ontrack = (e)=>{ document.getElementById('remoteAudio').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = ()=>{
    if(pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')){
      endCall('Connection lost');
    }
  };
  localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
  localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
}

async function appCall(targetId){
  if(!wsReady){ toast('Not connected to the server yet'); return; }
  peer = targetId.toLowerCase();
  showCallScreen('Calling', nameFor(peer), 'dialing');
  try{
    await makePeer();
    const offer = await pc.createOffer({ offerToReceiveAudio:true });
    await pc.setLocalDescription(offer);
    signal({ type:'offer', to:peer, offer });
  }catch(e){
    endCall('Microphone permission is needed');
  }
}

async function acceptCall(){
  stopRing();
  if(answerTimer){ clearTimeout(answerTimer); answerTimer = null; }
  const m = incoming; incoming = null;
  document.getElementById('callState').textContent = 'Connecting\u2026';
  try{
    await makePeer();
    await pc.setRemoteDescription(m.offer);
    await flushIce();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    signal({ type:'answer', to:peer, answer });
    renderCallControls('active');
    document.getElementById('callState').textContent = 'Connected';
  }catch(e){
    signal({ type:'reject', to:peer });
    endCall('Microphone permission is needed');
  }
}

function rejectCall(){
  stopRing();
  if(answerTimer){ clearTimeout(answerTimer); answerTimer = null; }
  signal({ type:'reject', to:peer });
  incoming = null;
  endCall('Declined');
}

function hangUp(){
  signal({ type:'hangup', to:peer });
  endCall('Call ended');
}

function endCall(reason){
  stopRing();
  if(answerTimer){ clearTimeout(answerTimer); answerTimer = null; }
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  iceQueue = []; incoming = null; peer = null;
  document.getElementById('remoteAudio').srcObject = null;
  code = '';
  show('dialer'); refresh();
  if(reason) toast(reason);
}

function toggleMute(btn){
  if(!localStream) return;
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  btn.classList.toggle('on', !track.enabled);
}

function showCallScreen(dir, who, mode){
  document.getElementById('callDir').textContent = dir;
  document.getElementById('callPeer').textContent = who;
  document.getElementById('callState').textContent = mode === 'ringing' ? 'wants to talk' : 'Ringing\u2026';
  renderCallControls(mode);
  show('call');
}

function renderCallControls(mode){
  const box = document.getElementById('callControls');
  box.innerHTML = '';
  if(mode === 'ringing'){
    const no = document.createElement('button');
    no.className = 'big end'; no.textContent = '\u2715'; no.onclick = rejectCall;
    const yes = document.createElement('button');
    yes.className = 'big accept'; yes.textContent = '\u2713'; yes.onclick = acceptCall;
    box.append(no, yes);
  }else{
    const mute = document.createElement('button');
    mute.className = 'big mute'; mute.textContent = '\u{1F399}'; mute.onclick = ()=>toggleMute(mute);
    const end = document.createElement('button');
    end.className = 'big end'; end.textContent = '\u2715'; end.onclick = hangUp;
    box.append(mute, end);
  }
}

const keys = document.getElementById('keys');
['1','2','3','4','5','6','7','8','9','','0',''].forEach(d=>{
  const b = document.createElement('button');
  b.className = d ? 'key' : 'key blank';
  b.textContent = d;
  if(d) b.onclick = ()=>press(d);
  keys.appendChild(b);
});

function press(d){
  if(code.length >= 6) return;
  code += d; refresh();
}
function backspace(){ code = code.slice(0,-1); refresh(); }

function match(){ return db.items.find(i=>i.code === code); }

function refresh(){
  clearTimeout(idleTimer); clearInterval(tick);
  document.getElementById('countdown').textContent = '';

  const el = document.getElementById('code');
  el.textContent = code || '\u2014';
  el.classList.toggle('empty', !code);

  const hit = match();
  const who = document.getElementById('who');
  const via = document.getElementById('via');
  const btn = document.getElementById('callBtn');

  if(hit){
    who.textContent = hit.name; who.classList.remove('miss');
    via.textContent = hit.kind === 'app' ? 'App call to ' + hit.target : hit.target;
    btn.disabled = false;
    if(db.auto) armAutoDial();
  }else{
    who.textContent = code ? 'No contact on this code' : '';
    who.classList.toggle('miss', !!code);
    via.textContent = '';
    btn.disabled = true;
  }
}

function armAutoDial(){
  let left = Math.round(db.delay / 1000);
  const cd = document.getElementById('countdown');
  cd.textContent = 'Calling in ' + left + '\u2026';
  tick = setInterval(()=>{
    left -= 1;
    cd.textContent = left > 0 ? 'Calling in ' + left + '\u2026' : 'Calling\u2026';
  }, 1000);
  idleTimer = setTimeout(startCall, db.delay);
}

function startCall(){
  clearTimeout(idleTimer); clearInterval(tick);
  const hit = match();
  if(!hit) return;
  if(hit.kind === 'app'){
    appCall(hit.target);
  }else{
    window.location.href = 'tel:' + hit.target.replace(/\s+/g,'');
    code = ''; refresh();
  }
}

let kind = 'phone';
function setKind(k){
  kind = k;
  document.getElementById('segPhone').classList.toggle('on', k === 'phone');
  document.getElementById('segApp').classList.toggle('on', k === 'app');
  document.getElementById('targetLabel').textContent = k === 'phone' ? 'Phone number' : 'Their app ID';
  const f = document.getElementById('fTarget');
  f.placeholder = k === 'phone' ? '+919305578983' : 'amit/22';
  f.type = k === 'phone' ? 'tel' : 'text';
}

function renderList(){
  const box = document.getElementById('rows');
  if(!db.items.length){
    box.innerHTML = '<div class="empty">No codes yet.<br>Add one below, then type it on the keypad.</div>';
    return;
  }
  const sorted = [...db.items].sort((a,b)=>Number(a.code)-Number(b.code));
  box.innerHTML = '';
  sorted.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="tag"></div><div class="rowmain">' +
      '<div class="rowname"></div><div class="rowsub"></div></div>' +
      '<button class="del">Remove</button>';
    row.querySelector('.tag').textContent = item.code;
    const nm = row.querySelector('.rowname');
    nm.textContent = item.name;
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = item.kind === 'app' ? 'app' : 'phone';
    nm.appendChild(pill);
    row.querySelector('.rowsub').textContent = item.target;
    row.querySelector('.del').onclick = ()=>{
      db.items = db.items.filter(i=>i.code !== item.code);
      persist(); renderList(); refresh();
    };
    box.appendChild(row);
  });
}

function saveContact(e){
  e.preventDefault();
  const c = document.getElementById('fCode').value.trim();
  const n = document.getElementById('fName').value.trim();
  const t = document.getElementById('fTarget').value.trim();

  if(!/^\d{1,6}$/.test(c)){ toast('Code must be 1 to 6 digits'); return; }
  if(kind === 'app'){
    if(t.toLowerCase() === db.id){ toast('That is your own ID'); return; }
    if(!ID_FORMAT.test(t.toLowerCase())){ toast('App ID must be name/number, like amit/22'); return; }
  }

  db.items = db.items.filter(i=>i.code !== c);
  db.items.push({ code:c, name:n, target:t, kind });
  persist();
  e.target.reset(); setKind('phone');
  renderList(); refresh();
}

document.getElementById('autoDial').onchange = (e)=>{ db.auto = e.target.checked; persist(); refresh(); };
document.getElementById('delay').onchange = (e)=>{ db.delay = Number(e.target.value); persist(); refresh(); };
document.getElementById('knownOnly').onchange = (e)=>{ db.knownOnly = e.target.checked; persist(); };
document.getElementById('ringOn').onchange = (e)=>{
  db.ring = e.target.checked; persist();
  if(db.ring){ unlockAudio(); testRing(); }
};
document.getElementById('autoAnswer').onchange = (e)=>{ db.autoAnswer = e.target.checked; persist(); };
document.getElementById('answerDelay').onchange = (e)=>{ db.answerDelay = Number(e.target.value); persist(); };
document.getElementById('keepAwake').onchange = (e)=>{
  db.keepAwake = e.target.checked; persist();
  if(db.keepAwake) requestWakeLock(); else releaseWakeLock();
};

function exportData(){
  const safe = { ...db }; delete safe.pass;
  const blob = new Blob([JSON.stringify(safe,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quickdial-backup.json';
  a.click();
}
function resetAll(){
  if(!confirm('Delete your ID and all codes?')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}

const manifest = {
  name:'Quick Dial', short_name:'Quick Dial', display:'standalone',
  background_color:'#0E1118', theme_color:'#0E1118', start_url:'.'
};
const ml = document.createElement('link');
ml.rel = 'manifest';
ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
document.head.appendChild(ml);

load();
setKind('phone');
requestWakeLock();
if(db.id && db.pass){ authMode = 'signin'; show('dialer'); connect(); refresh(); paintStatus(); }
else { setMode('signup'); show('setup'); }

document.addEventListener('keydown', e=>{
  if(document.activeElement.tagName === 'INPUT') return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key === 'Backspace') backspace();
  else if(e.key === 'Enter') startCall();
});
</script>
</body>
